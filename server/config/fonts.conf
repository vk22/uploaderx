<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Points fontconfig at the cover-generation fonts (bind-mounted at
  /app/data/fonts from client/public/fonts, read-only) in addition to the
  system defaults, so sharp's text rendering can resolve "Montserrat
  SemiBold" / "Montserrat Light" by family name without installing them
  system-wide or running fc-cache. Activated via FONTCONFIG_FILE in
  server/Dockerfile.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/app/data/fonts</dir>
</fontconfig>
